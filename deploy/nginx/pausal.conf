# Bootstrap konfiguracija: samo HTTP.
#
# OVA DATOTEKA ŽIVI U viewaro-web REPOU, u deploy/nginx/. Ovdje stoji jer je
# pausal ono što ona poslužuje — nginx je tuđi, sadržaj je naš.
#
# Vrijedi dok certifikat ne postoji (certbot prvo mora odgovoriti na ACME
# HTTP-01 izazov na portu 80). Kad je certifikat izdan, zamijeni je s
# pausal.conf.tls-template i reloadaj nginx.
#
# Do api-ja i weba dolazi se preko vanjske mreže `proxy` (docker network
# create proxy), po aliasima iz docker-compose.prod.yml.

limit_req_zone $binary_remote_addr zone=pausal:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name pausal.itquotes.hr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
