# Bootstrap vhost for the Xtream review demo (xtream.viewaro.itquotes.hr).
#
# Answers only the ACME challenge until certbot has issued the certificate;
# then xtream.conf.tls-template is copied over this file on the server, the
# same arrangement as tvh.conf. See deploy/README.md.
#
# DNS-only in Cloudflare (grey cloud), like tvh: it streams video.

server {
    listen 80;
    listen [::]:80;
    server_name xtream.viewaro.itquotes.hr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
