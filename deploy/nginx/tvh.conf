# Bootstrap vhost for the Tvheadend review demo (tvh.viewaro.itquotes.hr).
#
# Answers only the ACME challenge until certbot has issued the certificate;
# then tvh.conf.tls-template is copied over this file on the server, the same
# arrangement as viewaro.conf and pausal.conf. See deploy/README.md.
#
# The name is DNS-only in Cloudflare (grey cloud), not proxied: Cloudflare's
# self-serve CDN terms do not allow serving video through the proxy, and this
# host exists to stream it.

server {
    listen 80;
    listen [::]:80;
    server_name tvh.viewaro.itquotes.hr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
