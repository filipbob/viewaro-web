# Bootstrap config: plain HTTP only.
# Used until the TLS certificate exists (certbot needs this to answer the
# ACME HTTP-01 challenge on port 80 first). Once the cert has been issued,
# swap this file for viewaro.conf.tls-template and reload nginx — see
# deploy/README.md.

limit_req_zone $binary_remote_addr zone=viewaro:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name viewaro.itquotes.hr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    root /usr/share/nginx/html;
    index index.html;

    limit_req zone=viewaro burst=40 nodelay;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
