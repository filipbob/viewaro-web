# Tvheadend server for App Review: a real Tvheadend 4.3 with four channels of
# openly licensed films, reached only through the viewaro-web nginx on
# tvh.viewaro.itquotes.hr. README.md in this folder is the runbook.
name: tvheadend-demo

# Pinned by digest so the ffmpeg that encodes the media is the one that
# streams it, and so an upstream image change never lands mid-review.
x-image: &image lscr.io/linuxserver/tvheadend@sha256:04caf2d70776233154fff1a184647c72068b3aa1593f3576c1c9ea3a755ae18c

services:
  tvheadend:
    image: *image
    container_name: tvheadend-demo
    restart: unless-stopped
    environment:
      PUID: "1001"
      PGID: "1001"
      TZ: Etc/UTC
    volumes:
      - ./data/config:/config
      - ./data/media:/demo/media:ro
      - ./bin:/demo/bin:ro
      # Tvheadend discovers internal XMLTV grabbers by scanning PATH at start.
      - ./bin/tv_grab_viewaro_demo:/usr/local/bin/tv_grab_viewaro_demo:ro
    ports:
      # Loopback only, for checks on the host and SSH tunnels; never public.
      - "127.0.0.1:19981:9981"
    networks:
      tvh-demo:
        ipv4_address: 172.30.40.10
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9981/api/serverinfo"]
      interval: 60s
      timeout: 10s
      retries: 3

  # One-off media job: docker compose run --rm prepare
  prepare:
    image: *image
    profiles: ["tools"]
    user: "1001:1001"
    entrypoint: ["python3", "/demo/app/bin/prepare_media.py"]
    volumes:
      - ./:/demo/app:ro
      - ./data/media:/demo/media

networks:
  # Shared only by this container and the viewaro-web nginx, so the demo
  # server cannot reach the pausal stacks on the `proxy` network. Created by
  # hand once, like `proxy`:
  #   docker network create --subnet 172.30.40.0/24 tvh-demo
  tvh-demo:
    external: true
