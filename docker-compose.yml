services:
  web:
    build: .
    image: viewaro-web:latest
    container_name: viewaro-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # nginx config lives outside the image so HTTP -> HTTPS can be swapped
      # in after the TLS cert exists, without a rebuild.
      - ./deploy/nginx:/etc/nginx/conf.d:ro
      # ../nginx-logs = ~/app/nginx-logs, a sibling of this repo checkout —
      # matches the logpath already configured in the host's
      # /etc/fail2ban/jail.d/nginx.local. Do not change without updating that
      # file too; fail2ban cannot see inside the container's own filesystem.
      - ../nginx-logs:/var/log/nginx
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ../certbot-webroot:/var/www/certbot:ro
    networks:
      # `default` stays listed explicitly: naming any network replaces the
      # implicit default, and dropping it would move this container off
      # viewaro-web_default.
      default: {}
      # This nginx is also the front door for pausal-manager, which lives in
      # its own compose stack (~/app/pausal-manager) and publishes no ports.
      # deploy/nginx/pausal.conf reaches it over this shared network by the
      # aliases `pausal-api` / `pausal-web`.
      proxy: {}
      # And for the review demo servers (deploy/tvheadend-demo), on a network
      # of their own so they cannot reach the pausal stacks on `proxy`.
      # tvh.conf and xtream.conf reach them as `tvheadend-demo` and
      # `xtream-demo`.
      tvh-demo: {}

networks:
  # Created by neither stack — once, by hand: docker network create proxy
  proxy:
    external: true
  # Created once, by hand: docker network create --subnet 172.30.40.0/24 tvh-demo
  tvh-demo:
    external: true
