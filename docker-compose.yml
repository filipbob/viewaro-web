services:
  web:
    build: .
    image: viewaro-web:latest
    container_name: viewaro-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # nginx config lives outside the image so HTTP -> HTTPS can be swapped
      # in after the TLS cert exists, without a rebuild.
      - ./deploy/nginx:/etc/nginx/conf.d:ro
      # ../nginx-logs = ~/app/nginx-logs, a sibling of this repo checkout —
      # matches the logpath already configured in the host's
      # /etc/fail2ban/jail.d/nginx.local. Do not change without updating that
      # file too; fail2ban cannot see inside the container's own filesystem.
      - ../nginx-logs:/var/log/nginx
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ../certbot-webroot:/var/www/certbot:ro
